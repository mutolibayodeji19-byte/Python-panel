<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Project Cancelled | Lord Zenith</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #050505;
    color: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
}

.container {
    width: 100%;
    max-width: 850px;
}

.x-mark {
    color: #ff2020;
    font-size: clamp(130px, 35vw, 260px);
    font-weight: 900;
    line-height: 0.95;
    text-shadow: 0 0 35px rgba(255, 0, 0, 0.25);
}

h1 {
    font-size: clamp(30px, 7vw, 68px);
    font-weight: 900;
    letter-spacing: 2px;
    margin: 28px 0 18px;
}

.subtitle {
    color: #ff3030;
    font-size: clamp(13px, 3vw, 19px);
    font-weight: bold;
    letter-spacing: 3px;
}

hr {
    border: 0;
    height: 1px;
    background: #333;
    margin: 30px auto;
    max-width: 520px;
}

.details {
    color: #999;
    line-height: 2.2;
    font-size: 13px;
    letter-spacing: 1px;
}

.quote {
    color: #bbb;
    font-style: italic;
    margin-top: 30px;
}

.footer {
    margin-top: 35px;
    font-weight: bold;
    letter-spacing: 3px;
}

.founder {
    color: #ff3030;
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: 2px;
}
</style>
</head>
<body>
<main class="container">
    <div class="x-mark" aria-label="Cancelled">✖</div>

    <h1>PROJECT CANCELLED</h1>
    <p class="subtitle">ALL DEVELOPMENT TERMINATED</p>

    <hr>

    <div class="details">
        <p>STATUS: PERMANENTLY CLOSED</p>
        <p>DEVELOPMENT: TERMINATED</p>
        <p>UPDATES: DISCONTINUED</p>
        <p>MAINTENANCE: ENDED</p>
    </div>

    <p class="quote">
        “Every project has its final chapter.”
    </p>

    <div class="footer">LORD ZENITH</div>
    <p class="founder">FOUNDER &amp; FORMER ADMINISTRATOR</p>
</main>
</body>
</html>
