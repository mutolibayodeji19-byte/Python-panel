<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset=".5" stop-color="#07152c"/>
      <stop offset="1" stop-color="#100b1c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset=".3" stop-color="#b98b39"/>
      <stop offset=".55" stop-color="#ffe6a0"/>
      <stop offset="1" stop-color="#74501b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d42"/>
      <stop offset=".45" stop-color="#0878ed"/>
      <stop offset="1" stop-color="#030817"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38e8ff"/>
      <stop offset=".5" stop-color="#087bff"/>
      <stop offset="1" stop-color="#493dff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#087bff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#087bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="shadow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>
  <ellipse cx="800" cy="650" rx="500" ry="580" fill="url(#glow)"/>
  <ellipse cx="250" cy="1150" rx="400" ry="350" fill="#a87524" opacity=".13" filter="url(#blur)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M-100 850 Q250 450 650 720 T1320 420" stroke="#087bff" stroke-width="5" opacity=".8"/>
    <path d="M-100 890 Q250 490 650 760 T1320 460" stroke="#35dfff" stroke-width="2" opacity=".6"/>
    <path d="M-100 1120 Q250 820 600 1020 T1300 800" stroke="url(#metal)" stroke-width="3" opacity=".65"/>
    <path d="M-100 1150 Q250 850 600 1050 T1300 830" stroke="#087bff" stroke-width="2" opacity=".5"/>
  </g>

  <g transform="translate(655 345) rotate(13)">
    <rect x="-175" y="-330" width="370" height="720" rx="58" fill="#087bff" opacity=".3" filter="url(#shadow)"/>
    <rect x="-190" y="-350" width="380" height="740" rx="58" fill="url(#metal)"/>
    <rect x="-182" y="-342" width="364" height="724" rx="52" fill="#050913"/>
    <rect x="-169" y="-329" width="338" height="698" rx="43" fill="url(#screen)"/>

    <path d="M-165 -50 Q-40 -230 170 -130 L170 40 Q20 210 -165 140Z" fill="#0cb9ff" opacity=".22"/>
    <path d="M-165 160 Q20 -40 170 110 L170 260 Q-20 380 -165 270Z" fill="#483bff" opacity=".35"/>

    <path d="M-165 20 Q-20 -110 170 -180" fill="none" stroke="#4ee7ff" stroke-width="3" opacity=".9"/>
    <path d="M-165 60 Q-20 -70 170 -140" fill="none" stroke="#ffffff" stroke-width="1.5" opacity=".45"/>

    <rect x="-58" y="-316" width="116" height="27" rx="14" fill="#02050b"/>
    <circle cx="34" cy="-302" r="5" fill="#16345d"/>

    <g transform="translate(0 25)" fill="none" stroke="url(#metal)" stroke-width="4">
      <circle r="78" opacity=".8"/>
      <circle r="61" opacity=".65"/>
      <path d="M-38 0 L-10 28 L42 -36" stroke="#55eaff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect x="-176" y="-165" width="5" height="70" rx="2" fill="#ffe6a0"/>
    <rect x="171" y="-160" width="5" height="105" rx="2" fill="#b98b39"/>
  </g>

  <g fill="url(#metal)" opacity=".9">
    <circle cx="180" cy="400" r="3"/>
    <circle cx="290" cy="310" r="2"/>
    <circle cx="920" cy="260" r="3"/>
    <circle cx="1010" cy="540" r="2"/>
    <circle cx="850" cy="1050" r="3"/>
    <circle cx="350" cy="1280" r="3"/>
    <circle cx="1000" cy="1280" r="2"/>
    <circle cx="150" cy="950" r="2"/>
  </g>

  <path d="M0 1430 Q350 1310 620 1450 T1200 1390 L1200 1600 L0 1600Z" fill="#020611" opacity=".7"/>
</svg>
