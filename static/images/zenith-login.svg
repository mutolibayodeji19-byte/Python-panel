<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<defs>
  <linearGradient id="bg" x2="1" y2="1">
    <stop stop-color="#020611"/>
    <stop offset=".5" stop-color="#07152b"/>
    <stop offset="1" stop-color="#100b1d"/>
  </linearGradient>
  <linearGradient id="cloak" x2="1" y2="1">
    <stop stop-color="#18365c"/>
    <stop offset=".5" stop-color="#080f20"/>
    <stop offset="1" stop-color="#02050c"/>
  </linearGradient>
  <linearGradient id="gold" x2="1" y2="1">
    <stop stop-color="#fff0bd"/>
    <stop offset=".45" stop-color="#d7a746"/>
    <stop offset="1" stop-color="#76501e"/>
  </linearGradient>
  <linearGradient id="blue" x2="1" y2="1">
    <stop stop-color="#a5f6ff"/>
    <stop offset=".4" stop-color="#20cfff"/>
    <stop offset="1" stop-color="#0758ff"/>
  </linearGradient>
  <radialGradient id="aura">
    <stop stop-color="#087bff" stop-opacity=".55"/>
    <stop offset="1" stop-color="#087bff" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="15"/>
  </filter>
</defs>

<rect width="1200" height="1600" fill="url(#bg)"/>
<ellipse cx="800" cy="640" rx="520" ry="650" fill="url(#aura)"/>

<!-- Moon and cinematic atmosphere -->
<circle cx="860" cy="390" r="210" fill="#138bff" opacity=".12"/>
<circle cx="860" cy="390" r="160" fill="none" stroke="#4acfff" stroke-width="2" opacity=".35"/>
<circle cx="860" cy="390" r="185" fill="none" stroke="#d7a746" stroke-width="1" opacity=".35"/>

<!-- Energy arcs -->
<g fill="none" stroke-linecap="round">
  <path d="M-100 730 Q260 350 620 630 T1300 330" stroke="#087bff" stroke-width="5" opacity=".8"/>
  <path d="M-100 765 Q260 385 620 665 T1300 365" stroke="#44dcff" stroke-width="2" opacity=".8"/>
  <path d="M-100 1100 Q250 800 650 980 T1300 760" stroke="url(#gold)" stroke-width="3" opacity=".7"/>
</g>

<!-- Original masked shinobi character -->
<g transform="translate(680 650)">
  <!-- Back hair / hood -->
  <path d="M-235 -110 L-290 -285 L-185 -250 L-220 -385
           L-95 -310 L-40 -420 L35 -310 L160 -365
           L145 -245 L255 -275 L205 -100
           L190 170 L120 310 L-120 310 L-200 160Z"
        fill="#030813" stroke="#183d68" stroke-width="7"/>

  <!-- Hair highlights -->
  <path d="M-220 -220 L-145 -165 L-185 -305
           M-95 -300 L-65 -200
           M110 -275 L70 -180
           M190 -215 L130 -130"
        fill="none" stroke="#1a83d8" stroke-width="8" opacity=".65"/>

  <!-- Face -->
  <path d="M-172 -150 Q-180 -55 -128 45 L-75 125
           L75 125 L128 45 Q180 -55 172 -150
           Q100 -235 0 -220 Q-100 -235 -172 -150Z"
        fill="#111c30" stroke="url(#gold)" stroke-width="4"/>

  <!-- Headband -->
  <path d="M-180 -160 Q0 -220 180 -160 L170 -105 Q0 -150 -170 -105Z"
        fill="url(#gold)" opacity=".9"/>
  <path d="M-95 -150 L95 -150" stroke="#263a59" stroke-width="5"/>

  <!-- Eyes -->
  <path d="M-145 -65 Q-92 -110 -35 -65 Q-87 -30 -145 -65Z"
        fill="#020711" stroke="#39dfff" stroke-width="4"/>
  <path d="M35 -65 Q92 -110 145 -65 Q87 -30 35 -65Z"
        fill="#020711" stroke="#39dfff" stroke-width="4"/>

  <path d="M-125 -66 L-65 -67 L-90 -57Z" fill="url(#blue)"/>
  <path d="M65 -67 L125 -66 L90 -57Z" fill="url(#blue)"/>

  <path d="M-115 -66 L-65 -66 M65 -66 L115 -66"
        stroke="#8ef6ff" stroke-width="6" filter="url(#glow)"/>

  <!-- Face mask -->
  <path d="M-120 -20 Q0 15 120 -20 L92 100
           L0 150 L-92 100Z"
        fill="#050b16" stroke="#254b73" stroke-width="4"/>
  <path d="M-70 45 L-30 65 L-70 80
           M70 45 L30 65 L70 80"
        fill="none" stroke="url(#gold)" stroke-width="5"/>

  <!-- Neck and shoulder armor -->
  <path d="M-65 110 L-95 190 L-220 230 L-300 420
           Q0 500 300 420 L220 230 L95 190 L65 110Z"
        fill="url(#cloak)" stroke="#1b568c" stroke-width="6"/>

  <path d="M-185 245 L-70 200 L0 275 L70 200
           L185 245 L125 320 L0 360 L-125 320Z"
        fill="#07162c" stroke="url(#gold)" stroke-width="4"/>

  <path d="M-220 365 L-80 330 L0 385 L80 330 L220 365"
        fill="none" stroke="#168cff" stroke-width="5"/>

  <!-- Gold shoulder details -->
  <path d="M-255 285 L-205 265 L-165 305
           M255 285 L205 265 L165 305"
        fill="none" stroke="url(#gold)" stroke-width="8"/>

  <!-- Sword behind shoulder -->
  <g transform="rotate(36)">
    <rect x="215" y="-350" width="20" height="570" rx="8"
          fill="url(#gold)"/>
    <path d="M225 -350 L235 -300 L225 200 L215 -300Z"
          fill="#b9edff" opacity=".8"/>
    <rect x="190" y="160" width="70" height="18" rx="6"
          fill="#182c49" stroke="url(#gold)" stroke-width="4"/>
    <rect x="216" y="180" width="18" height="100" rx="6"
          fill="#d7a746"/>
  </g>
</g>

<!-- Gold sparks -->
<g fill="url(#gold)">
  <circle cx="245" cy="370" r="4"/>
  <circle cx="375" cy="290" r="3"/>
  <circle cx="1020" cy="520" r="4"/>
  <circle cx="980" cy="920" r="3"/>
  <circle cx="285" cy="1070" r="4"/>
  <circle cx="880" cy="1180" r="3"/>
  <circle cx="180" cy="760" r="2"/>
  <circle cx="1050" cy="1100" r="2"/>
</g>

<!-- Dark lower vignette -->
<path d="M0 1320 Q350 1190 650 1350 T1200 1270 L1200 1600 L0 1600Z"
      fill="#020611" opacity=".85"/>
</svg>
